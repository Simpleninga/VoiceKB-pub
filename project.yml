name: VoiceKB
options:
  bundleIdPrefix: com.simpleninga
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  VoiceKB:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: VoiceKBKeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 芽音
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        VoiceKBKey: ""      # 服务密钥：不进 git，发版时由发版脚本写进安装包（服务器地址 VoiceKBHosts 同理）
        CFBundleURLTypes:
          - CFBundleURLName: com.simpleninga.voicekb
            CFBundleURLSchemes: [voicekb]
        NSMicrophoneUsageDescription: 芽音需要用麦克风听你说话。
        NSSpeechRecognitionUsageDescription: 芽音需要把你说的话转成文字。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simpleninga.voicekb
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VoiceKBKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 芽音
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simpleninga.voicekb.keyboard
  VoiceKBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Keyboard
        excludes: ["Info.plist"]
      - Shared
      - Tests
    dependencies:
      - target: VoiceKB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.simpleninga.voicekb.tests
